<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系方式 - 校园失物招领</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
  <div class="phone-screen profile-screen">
    <main class="contact-page" aria-labelledby="contact-title">
      <a class="page-back page-back-icon" href="./profile.html" aria-label="返回我的" title="返回我的"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg></a>
      <h1 id="contact-title">联系方式</h1>
      <p class="contact-intro">修改后会作为之后发布信息时的默认联系方式。</p>
      <form class="contact-form" id="contact-form">
        <label for="contact-value">我的联系方式</label>
        <input id="contact-value" name="contact" type="text" maxlength="80" placeholder="例如：微信号或手机号">
        <p class="form-message" data-contact-message role="status"></p>
        <button class="primary-button" type="submit">保存联系方式</button>
      </form>
    </main>
    <nav class="app-bottom-nav" aria-label="底部导航"><a class="bottom-nav-link" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>首页</a><a class="bottom-nav-link publish-nav" href="./publish.html"><span class="nav-plus" aria-hidden="true">＋</span>发布</a><a class="bottom-nav-link active" href="./profile.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</a></nav>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/contact.js"></script>
</body>
</html>
