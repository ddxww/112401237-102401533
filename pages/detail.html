<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信息详情 | 拾光</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/detail.css">
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body>
  <div class="phone-screen detail-screen">
    <header class="detail-topbar">
      <a class="detail-back" href="javascript:history.back()" aria-label="返回"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg></a>
      <h1>信息详情</h1>
      <div class="detail-top-actions">
        <button id="save-detail" type="button" aria-label="收藏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12a1 1 0 0 1 1 1v16l-7-4-7 4v-16a1 1 0 0 1 1-1Z"/></svg>
        </button>
        <button id="share-detail" type="button" aria-label="分享">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.4M8.2 13.2l7.5 4.4"/></svg>
        </button>
      </div>
    </header>

    <main class="detail-shell">
      <div class="detail-layout" id="detail-content"></div>
    </main>

    <div class="detail-contact-bar">
      <button class="contact-main-button" id="contact-publisher" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.5 8.5 0 0 1-4-.9L4 20l1.4-3.2A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/></svg>
        联系发布者
      </button>
    </div>
  </div>

  <div class="toast hidden" id="copy-toast" role="status">联系请求已发送</div>
  <script src="../js/data.js?v=3"></script>
  <script src="../js/card.js"></script>
  <script src="../js/detail.js"></script>
</body>
</html>
