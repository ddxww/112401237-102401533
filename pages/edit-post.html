<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑发布 - 校园失物招领</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/publish.css">
</head>
<body>
  <div class="phone-screen publish-screen">
    <main class="publish-page edit-page" aria-labelledby="edit-title">
      <a class="page-back page-back-icon" href="./profile.html" aria-label="返回我的" title="返回我的"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg></a>
      <h1 id="edit-title">编辑发布</h1>
      <form id="edit-form" novalidate>
        <fieldset class="type-switch"><legend class="sr-only">信息类型</legend><label><input type="radio" name="type" value="lost"><span>寻物</span></label><label><input type="radio" name="type" value="found"><span>招领</span></label></fieldset>
        <div class="field-grid"><label class="form-field"><span>物品名称 <b>*</b></span><input name="title" maxlength="40" required><small data-error="title"></small></label><label class="form-field"><span>分类 <b>*</b></span><select name="category" required><option value="">请选择</option><option>证件</option><option>数码</option><option>钥匙</option><option>生活用品</option><option>书籍</option><option>其他</option></select><small data-error="category"></small></label></div>
        <div class="form-field image-field"><span>物品图片</span><div class="image-upload-grid"><label class="image-upload-slot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM7 16l3-3 2 2 3-4 3 5M8 8h.01"/></svg><span>添加图片</span><input name="image" data-image-slot="1" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="image-upload-slot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM7 16l3-3 2 2 3-4 3 5M8 8h.01"/></svg><span>添加图片</span><input name="image" data-image-slot="2" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="image-upload-slot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM7 16l3-3 2 2 3-4 3 5M8 8h.01"/></svg><span>添加图片</span><input name="image" data-image-slot="3" type="file" accept="image/jpeg,image/png,image/webp"></label></div><small data-error="image"></small></div>
        <label class="form-field"><span>特征描述 <b>*</b></span><textarea name="description" maxlength="240" required></textarea><small data-error="description"></small></label>
        <div class="field-grid"><label class="form-field"><span>时间 <b>*</b></span><input name="date" type="date" required><small data-error="date"></small></label><label class="form-field"><span>地点 <b>*</b></span><input name="location" maxlength="40" required><small data-error="location"></small></label></div>
        <label class="form-field"><span>具体位置 <b>*</b></span><input name="locationDetail" maxlength="60" required><small data-error="locationDetail"></small></label>
        <label class="form-field"><span>联系方式 <b>*</b></span><input name="contact" maxlength="80" required><small data-error="contact"></small></label>
        <p id="edit-form-message" class="form-message" role="alert"></p><button class="primary-button" type="submit">保存修改</button>
      </form>
    </main>
    <nav class="app-bottom-nav" aria-label="底部导航"><a class="bottom-nav-link" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>首页</a><a class="bottom-nav-link publish-nav" href="./publish.html"><span class="nav-plus" aria-hidden="true">＋</span>发布</a><a class="bottom-nav-link active" href="./profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</a></nav>
  </div>
  <script src="../js/data.js"></script><script src="../js/edit-post.js"></script>
</body>
</html>
