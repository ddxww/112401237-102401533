<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布信息 - 校园失物招领</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/publish.css">
</head>
<body>
  <div class="phone-screen publish-screen">
    <main class="publish-page" aria-labelledby="publish-title">
      <a class="page-back" href="../index.html">返回首页</a>
      <h1 id="publish-title">发布信息</h1>
      <form id="publish-form" novalidate>
        <fieldset class="type-switch">
          <legend class="sr-only">信息类型</legend>
          <label><input type="radio" name="type" value="lost" checked><span class="icon-wrap" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m10.5 14.5 7-7a3 3 0 1 1 4 4l-7 7a3 3 0 0 1-4-4Z"/><path d="m13 11-2-2M8 16l-2 2M5 13l-2 2"/></svg></span><span>寻物</span></label>
          <label><input type="radio" name="type" value="found"><span class="icon-wrap" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg></span><span>招领</span></label>
        </fieldset>
        <div class="field-grid">
          <label class="form-field"><span>物品名称 <b>*</b></span><input name="title" maxlength="40" required placeholder="请输入物品名称"><small data-error="title"></small></label>
          <label class="form-field"><span>分类 <b>*</b></span><select name="category" required><option value="">请选择</option><option>证件</option><option>数码</option><option>钥匙</option><option>生活用品</option><option>书籍</option><option>其他</option></select><small data-error="category"></small></label>
        </div>
        <label class="form-field"><span>物品图片</span><span class="upload-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM7 16l3-3 2 2 3-4 3 5M8 8h.01"/></svg><span>添加清晰图片，最多 3 张</span><input name="image" type="file" accept="image/*" multiple></span></label>
        <label class="form-field"><span>特征描述 <b>*</b></span><textarea name="description" maxlength="240" required placeholder="描述颜色、品牌、明显特征等，帮助快速识别"></textarea><small data-error="description"></small></label>
        <div class="field-grid">
          <label class="form-field"><span>时间 <b>*</b></span><input id="publish-date" name="date" type="date" required><small data-error="date"></small></label>
          <label class="form-field"><span>地点 <b>*</b></span><select id="publish-location" name="location" required><option value="">填写校内地点</option></select><small data-error="location"></small></label>
        </div>
        <label class="form-field"><span>联系方式 <b>*</b></span><input name="contact" maxlength="80" required placeholder="手机号 / 微信号（仅对联系者显示）"><small data-error="contact"></small></label>
        <p id="publish-form-message" class="form-message" role="alert"></p>
        <button class="primary-button" type="submit">发布信息</button>
      </form>
    </main>
    <nav class="app-bottom-nav" aria-label="主导航">
      <a class="bottom-nav-link" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 8-6 8 6v10H4zM9 20v-6h6v6"/></svg><span>首页</span></a>
      <a class="bottom-nav-link nav-plus active" href="./publish.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>发布</span></a>
      <a class="bottom-nav-link" href="./profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 21a7 7 0 0 1 14 0"/></svg><span>我的</span></a>
    </nav>
  </div>
  <script src="../js/data.js"></script>
  <script src="../js/publish.js"></script>
</body>
</html>
