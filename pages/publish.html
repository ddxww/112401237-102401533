<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布信息 | 拾光</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/publish.css">
</head>
<body>
  <div class="phone-screen publish-screen">
    <header class="publish-topbar">
      <a class="publish-back" href="../index.html" aria-label="返回首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg></a>
      <h1>发布信息</h1>
    </header>

    <main class="publish-page">
      <form id="publish-form" novalidate>
        <fieldset class="type-switch">
          <legend>信息类型</legend>
          <label><input type="radio" name="type" value="lost" checked><span>寻物</span></label>
          <label><input type="radio" name="type" value="found"><span>招领</span></label>
        </fieldset>

        <label class="form-field">
          <span>物品名称 <b>*</b></span>
          <input name="name" maxlength="40" required placeholder="例如：校园卡、蓝色水杯">
          <small data-error="name"></small>
        </label>

        <div class="field-grid">
          <label class="form-field">
            <span>分类 <b>*</b></span>
            <select name="category" required>
              <option value="">请选择分类</option>
              <option>证件</option>
              <option>电子产品</option>
              <option>日用品</option>
              <option>书籍文具</option>
              <option>钥匙</option>
              <option>其他</option>
            </select>
            <small data-error="category"></small>
          </label>
          <label class="form-field">
            <span>时间 <b>*</b></span>
            <input id="publish-date" name="date" type="date" required>
            <small data-error="date"></small>
          </label>
        </div>

        <div class="field-grid">
          <label class="form-field">
            <span>地点 <b>*</b></span>
            <select id="publish-location" name="location" required>
              <option value="">请选择地点</option>
            </select>
            <small data-error="location"></small>
          </label>
          <label class="form-field">
            <span>具体位置</span>
            <input name="locationDetail" maxlength="30" placeholder="例如：二楼、301">
          </label>
        </div>

        <label class="form-field">
          <span>简要描述 <b>*</b></span>
          <textarea name="description" maxlength="240" required placeholder="描述颜色、品牌、明显特征等"></textarea>
          <small data-error="description"></small>
        </label>

        <label class="form-field">
          <span>联系方式 <b>*</b></span>
          <input name="contact" maxlength="80" required placeholder="手机号 / 微信号 / QQ号">
          <small data-error="contact"></small>
        </label>

        <p class="form-message" id="publish-form-message" role="alert"></p>
        <button class="primary-button" type="submit">发布信息</button>
      </form>
    </main>

    <nav class="app-bottom-nav" aria-label="底部导航">
      <a class="bottom-nav-link" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>首页</a>
      <a class="bottom-nav-link active" href="./publish.html"><span class="nav-plus" aria-hidden="true">＋</span>发布</a>
      <a class="bottom-nav-link" href="./profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</a>
    </nav>
  </div>

  <script src="../js/data.js?v=4"></script>
  <script src="../js/publish.js"></script>
</body>
</html>
